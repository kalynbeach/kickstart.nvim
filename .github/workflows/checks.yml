name: Neovim checks

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: rhysd/action-setup-vim@b7934f0630263431f328b14fdd86c788f3fadbc8
        with:
          neovim: true
          version: v0.12.6
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install Tree-sitter CLI
        run: |
          curl -fsSL https://github.com/tree-sitter/tree-sitter/releases/download/v0.27.1/tree-sitter-linux-x64.gz -o "$RUNNER_TEMP/tree-sitter.gz"
          echo "d01042f94ba3d6827ddc9788e235f75d8366431be42bdf90ade534d960c98b7d  $RUNNER_TEMP/tree-sitter.gz" | sha256sum --check
          gzip -d "$RUNNER_TEMP/tree-sitter.gz"
          chmod +x "$RUNNER_TEMP/tree-sitter"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check startup and editor behavior
        run: scripts/check.sh
